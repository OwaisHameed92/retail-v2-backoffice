; Queue workers for the retail-v2 backoffice (installed as /etc/supervisor/conf.d/retail-v2-worker.conf).
; Jobs: report rebuilds after till pushes, emails (welcome, invoices), billing, AI. QUEUE_CONNECTION=database (or redis).
; If REPORTS_QUEUE is set in .env (e.g. "reports"), add it to --queue below (default first): --queue=default,reports
; deploy.sh runs `php artisan queue:restart` so workers pick up each release after their current job.
[program:retail-v2-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php __APP_ROOT__/current/artisan queue:work --queue=default --sleep=1 --tries=3 --backoff=10 --max-time=3600 --memory=512
directory=__APP_ROOT__/current
user=__APP_USER__
numprocs=2
autostart=true
autorestart=true
startsecs=1
stopasgroup=true
killasgroup=true
; Longer than the longest job, so a deploy or restart never kills a rebuild half way.
stopwaitsecs=600
redirect_stderr=true
stdout_logfile=/var/log/retail-v2/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
