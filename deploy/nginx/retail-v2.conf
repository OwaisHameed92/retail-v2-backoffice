# Nginx site for the retail-v2 backoffice (installed by server-setup.sh as /etc/nginx/sites-available/retail-v2.conf).
# HTTP only at first: `certbot --nginx -d __DOMAIN__` adds the 443 server block, the certificate and the redirect.
# Tills must reach the portal over HTTPS (contract): do not go live before certbot has run.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # current/ is a symlink to the live release; $realpath_root makes PHP see the real release path,
    # so a deploy switches over cleanly with opcache.validate_timestamps=0.
    root __APP_ROOT__/current/public;
    index index.php;
    charset utf-8;

    # Till pushes (SYNC_PUSH_MAX_BYTES, 50 MB gzip) and CSV imports.
    client_max_body_size 64m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/retail-v2.access.log;
    error_log  /var/log/nginx/retail-v2.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite assets are content-hashed: cache them for a year.
    location /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/retail-v2.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        internal;
    }

    # No other PHP file is ever executed, and dotfiles (.env, .git) are never served.
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
