; PHP-FPM pool for the retail-v2 backoffice (installed as /etc/php/8.4/fpm/pool.d/retail-v2.conf by server-setup.sh).
; Runs as the app user so the web, the queue workers and cron all write storage/ as the same user.
[retail-v2]
user = __APP_USER__
group = __APP_USER__
listen = /run/php/retail-v2.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
; Size for the server: about (RAM for PHP) / 80 MB. 2 vCPU / 4 GB: 20.
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 1000

; Till pushes can take a few seconds on big batches (config/sync.php).
request_terminate_timeout = 120s
catch_workers_output = yes
php_admin_value[error_log] = /var/log/retail-v2/php-fpm-error.log
php_admin_flag[log_errors] = on
