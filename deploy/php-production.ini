; Production PHP settings for the retail-v2 backoffice (fpm and cli conf.d/99-retail-v2.ini).
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 512M
max_execution_time = 120
; Till pushes are at most SYNC_PUSH_MAX_BYTES (50 MB, gzip); product imports are CSV uploads.
post_max_size = 64M
upload_max_filesize = 64M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 50000
; Releases are new folders behind a symlink: resolve it so a deploy is never served stale code.
opcache.validate_timestamps = 0
opcache.revalidate_path = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
