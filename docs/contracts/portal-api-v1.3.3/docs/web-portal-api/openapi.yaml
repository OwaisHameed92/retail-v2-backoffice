components:
  securitySchemes:
    branchKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: The branch sync API key (sync.hub_api_key) the portal issued at activation or migration. One key per branch.
  parameters:
    Contract:
      name: X-SSPOS-Contract
      in: header
      required: true
      description: Contract major version the till speaks. 1 today. See section 17.11.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "1"
    AppVersion:
      name: X-SSPOS-App-Version
      in: header
      required: true
      description: Till version.
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/appVersion"
      example: "3.0.412"
    StoreProtocol:
      name: X-SSPOS-Store-Protocol
      in: header
      required: true
      description: "The till's LAN store protocol version (src/SSPOS.Server/Contracts/StoreProtocol.cs)."
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "1"
    CompanyId:
      name: X-SSPOS-Company-Id
      in: header
      required: true
      description: Company of the calling till.
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000C001"
    BranchId:
      name: X-SSPOS-Branch-Id
      in: header
      required: true
      description: "Branch of the calling till; must be the API key's branch."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000B001"
    RegisterId:
      name: X-SSPOS-Register-Id
      in: header
      required: true
      description: "The sending till (the branch's main till)."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000R001"
    InstallId:
      name: X-SSPOS-Install-Id
      in: header
      required: true
      description: "The PC's install id (same as installId in the body)."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000H001"
    InstallIdOptional:
      name: X-SSPOS-Install-Id
      in: header
      required: false
      description: "The PC's install id, when the till has one."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000H001"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Unique per logical request (a ULID or UUID); a retry reuses it. The portal stores key + reply for at least 24 h and replays the reply."
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: "01K5T0Q8C4000000000000Z001"
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: "Optional on push: push is already idempotent by row."
      schema:
        type: string
        minLength: 8
        maxLength: 64
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: The till always sends gzip.
      schema:
        type: string
        enum:
          - gzip
      example: gzip
    SyncMode:
      name: X-SSPOS-Sync-Mode
      in: header
      required: false
      description: "delta (default) or initial (a migration upload). Unknown = 400."
      schema:
        type: string
        enum:
          - delta
          - initial
        default: delta
      example: delta
    UploadId:
      name: X-SSPOS-Upload-Id
      in: header
      required: false
      description: "Required when X-SSPOS-Sync-Mode is initial: upload.uploadId from the migrate reply."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
    Since:
      name: since
      in: query
      required: true
      description: Highest pull version this branch has applied (0 the first time).
      schema:
        type: integer
        minimum: 0
      example: 90400
    Max:
      name: max
      in: query
      required: false
