        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
  /api/v1/devices/activate:
    post:
      tags:
        - Onboarding
      operationId: activateDevice
      summary: Link a new till to a portal account (section 17.4)
      description: "No Authorization header: the activation code in the body is the credential. Rate-limited (section 17.12). Repeating the call with the same code from the same installId within 24 h returns the same 200 reply."
