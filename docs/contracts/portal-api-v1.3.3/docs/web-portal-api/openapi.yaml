  /api/v1/licence/activate:
    post:
      tags:
        - Licence
      operationId: activateLicenceKey
      summary: "Per-till licence: bind an e-mailed licence key to this PC and get its token (section 17.15.1)"
      description: "Sent by ANY till when the shop pastes the e-mailed key. No Authorization header needed: the licence key in the body is the credential (a till that has a branch key may still send it). First use binds the key to installId; the same installId again gets 200; another installId gets 409 key.already_used. Rate-limited (section 17.12). Since 2026-09-28 the signed token carries the shop: companyId/branchId (the same in every till key of the branch), businessName/branchName, the company block (businessType, address, town, postcode, phone, email, vatNumber, ownerName, receiptFooter), maxRegisters = tills allowed in the branch, features (multi_branch), limits.branches, validFrom/expiresAt - and the reply's licence summary lists them too (section 17.15.1). A new installId past the branch's maxRegisters gets 403 licence.seat_limit."
      security:
        - {}
        - branchKey: []
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/InstallId"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "./licensing/schemas/licence-activate-request.schema.json"
            examples:
              tillOne:
                summary: Till 1 pastes the e-mailed key
                externalValue: "./licensing/samples/licence-activate-request.json"
      responses:
        "200":
          description: OK - the key is bound to this PC; store licenceToken
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/licence-activate-reply.schema.json"
              examples:
                active:
                  summary: "Annual plan, Till 1 of 3, with the shop's details (token signed with the documentation key k13799fa4)"
                  externalValue: "./licensing/samples/licence-activate-reply.json"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          description: "key.not_found - no such licence key."
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/error-reply.schema.json"
              examples:
                notFound:
                  externalValue: "./licensing/samples/error.key-not-found.404.json"
        "409":
          description: "key.already_used - the key is bound to another PC (details: deviceName, installCode, activatedAtUtc)."
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/error-reply.schema.json"
              examples:
                alreadyUsed:
                  externalValue: "./licensing/samples/error.key-already-used.409.json"
        "410":
          description: "key.expired - past its activate-by date or withdrawn before use."
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/error-reply.schema.json"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
  /api/v1/licence/validate:
    post:
      tags:
        - Licence
      operationId: validateLicence
      summary: Daily licence check and heartbeat (section 17.5)
      description: "Per-till licensing (section 17.15.2): EVERY till with a portal licence sends it for itself once per onlineCheck.intervalHours, at start-up when due, and on Check again - identified by installId + licenceId + tokenSha256, no branch key required (example perTill). Branch model (17.5): the main till, listing registers[]. Licence problems are 200 + status (active, expiring, expired, revoked, suspended, released; unknown = not active), never an error status."
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/StoreProtocol"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/InstallIdOptional"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "./licensing/schemas/validate-request.schema.json"
            examples:
              leeds:
                summary: Leeds, two tills
                value:
                  licenceId: "01K5T0Q8C4000000000000Y001"
                  tokenSha256: "3848315811206cf590309eeefb2ce627a927f98167825e44049ea59910a2a3eb"
                  appVersion: "3.0.412"
                  approverKids:
                    - k76b44696
                  trustedKids:
                    - k13799fa4
                    - k76b44696
                  tillClockUtc: "2026-09-27T09:05:00Z"
                  clockWatermarkUtc: "2026-09-27T09:05:00Z"
                  lastValidatedAtUtc: "2026-09-26T09:00:05Z"
                  lastSyncAt: "2026-09-27T09:04:30Z"
                  lock:
                    locked: false
                    reason: null
                  registers:
                    - registerId: "01K5T0Q8C4000000000000R001"
                      code: "01"
                      name: Till 1
                      isMain: true
                      appVersion: "3.0.412"
                      installId: "01K5T0Q8C4000000000000H001"
                      deviceName: KIRKGATE-TILL1
                      lastSeenUtc: "2026-09-27T09:04:58Z"
                      isActive: true
                    - registerId: "01K5T0Q8C4000000000000R002"
                      code: "02"
                      name: Till 2
                      isMain: false
                      appVersion: "3.0.412"
                      installId: "01K5T0Q8C4000000000000H002"
                      deviceName: KIRKGATE-TILL2
                      lastSeenUtc: "2026-09-27T08:59:40Z"
                      isActive: true
                  diagnostics:
                    pendingSyncRows: 0
                    lastSyncError: null
                    databaseSizeMb: 84
      responses:
        "200":
          description: OK
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/validate-reply.schema.json"
              examples:
                trialExpiring:
                  summary: Trial, ends in 6 days
                  value:
                    status: expiring
                    licenceToken: null
                    licence:
                      licenceId: "01K5T0Q8C4000000000000Y001"
                      kind: trial
                      source: portal
                      expiresAt: "2026-10-03T09:00:00Z"
                      maxRegisters: 2
                      features: null
                      limits: null
                    registers:
