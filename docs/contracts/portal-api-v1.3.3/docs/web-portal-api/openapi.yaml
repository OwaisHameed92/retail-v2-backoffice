# SSPOS web portal API - OpenAPI 3.1. Prose: docs/web-portal-api.md. Generated from the samples; keep in step with them.
openapi: "3.1.0"
info:
  title: SSPOS web portal API
  version: "1.2.0"
  summary: "The contract between SSPOS 3 tills and the web portal: sync, licensing, devices, onboarding, migration."
  description: "Contract major version 1 (X-SSPOS-Contract: 1). The prose contract is docs/web-portal-api.md; where this file and a sample disagree, the sample wins. Schemas are JSON Schema 2020-12 referenced by relative path (schemas/ is generated from the till's C# types; licensing/schemas/ is the section 17 contract). Every reply may gain new fields; clients ignore fields they do not know."
  license:
    name: Proprietary - SSPOS
    identifier: LicenseRef-SSPOS-Proprietary
servers:
  - url: "https://{portalHost}"
    description: The portal. HTTPS only (TLS 1.2+).
    variables:
      portalHost:
        default: portal.example.co.uk
tags:
  - name: Onboarding
    description: Link a till to a portal account (section 17.3-17.4).
  - name: Licence
    description: Per-till activate and daily check, renewal, keys typed at a linked till and local keys reported by a local till (sections 17.5-17.6, 17.15-17.16).
  - name: Devices
    description: Seats and transfers (section 17.7).
  - name: Sync
    description: Rows up and down (sections 3-9).
  - name: Migration
    description: Local licence to cloud (section 17.8).
security:
  - branchKey: []
paths:
  /api/v1/sync/hello:
    get:
      tags:
        - Sync
      operationId: syncHello
      summary: "Check the address and key (Settings > Hub sync > Test)"
      description: Defined in section 4. No body. The till calls it when the owner presses Test, after activation, and before the first push of a day. The portal checks the key, the X-SSPOS-Branch-Id binding and the contract.
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/StoreProtocol"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/InstallIdOptional"
      responses:
        "200":
          description: OK
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./schemas/hello-reply.schema.json"
              examples:
                leeds:
                  summary: Leeds main till
                  value:
                    contractVersion: 1
                    companyId: "01K5T0Q8C4000000000000C001"
                    branchId: "01K5T0Q8C4000000000000B001"
                    branchName: Leeds Kirkgate
                    serverTimeUtc: "2026-09-23T09:41:12Z"
                    maxBatchRows: 5000
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "409":
          $ref: "#/components/responses/E409"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
  /api/v1/sync/push:
    post:
      tags:
        - Sync
      operationId: syncPush
      summary: "Till to portal: a batch of changed rows (sections 5 and 7)"
      description: "Body is gzip (Content-Encoding: gzip); accept an uncompressed body too (test tools). Delta mode keys rows by (branchId, seq). Initial mode (X-SSPOS-Sync-Mode: initial + X-SSPOS-Upload-Id, section 17.8) keys them by (uploadId, seq). Idempotent by (entity, entityId, version)."
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/StoreProtocol"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/InstallIdOptional"
        - $ref: "#/components/parameters/ContentEncoding"
        - $ref: "#/components/parameters/SyncMode"
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "./schemas/push-request.schema.json"
            examples:
              leeds:
                summary: Leeds till 1 (delta)
                externalValue: "./samples/push-request.json"
              leedsTill2:
                summary: A Leeds till 2 sale, sent by till 1
                externalValue: "./samples/push-request.second-till.json"
              bradford:
