  /api/v1/cloud/migrate:
    post:
      tags:
        - Migration
      operationId: migrateToCloud
      summary: "Link a branch that never synced and open its history upload - Connect with a sync key (section 17.8)"
      description: "Sent by the branch's main till when the owner presses Connect with a sync key and the branch has never sent anything (route A of SIMPLE-SETUP.md) - on any licence (a local key, the built-in trial or a portal licence: for a branch you already know answer 200 adopted with the same ids) - and when a local-licence shop enters a portal licence key. No Authorization header: activationCode (the sync key, which must also work as the branch's sync bearer, or the portal licence key) is the credential. Idempotent per (activationCode, installId): a retry returns the same reply and uploadId; the till repeats the Idempotency-Key and the first body (tillClockUtc, registers[].lastSeenUtc included) until you answer. After 200 the till says hello with apiKey, uploads its history with POST /api/v1/sync/push in initial mode, then calls /api/v1/cloud/migrate/complete. A wrong, expired or used sync key may be named sync_key.not_found / sync_key.expired / sync_key.used or activation.code_* (section 17.12)."
