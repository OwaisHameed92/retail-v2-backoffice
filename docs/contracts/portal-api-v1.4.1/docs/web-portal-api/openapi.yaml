# SSPOS web portal API - OpenAPI 3.1. Prose: docs/web-portal-api.md. Generated from the samples; keep in step with them.
openapi: "3.1.0"
info:
  title: SSPOS web portal API
  version: "1.4.0"
  summary: "The contract between SSPOS 3 tills and the web portal: sync, licensing, devices, onboarding, migration."
  description: "Contract major version 1 (X-SSPOS-Contract: 1), document revision 1.4 (package v1.4, 2026-09-29). The prose contract is docs/web-portal-api.md; where this file and a sample disagree, the sample wins. Schemas are JSON Schema 2020-12 referenced by relative path (schemas/ is generated from the till's C# types; licensing/schemas/ is the section 17 contract). Every reply may gain new fields; clients ignore fields they do not know. The till calls nine operations: sync hello / push / pull, licence activate / validate / redeem, devices/deactivate, cloud/migrate and its complete; devices/activate is kept for reference only (deprecated - not called). Every POST except a normal (delta) push carries an Idempotency-Key, one per logical request: a retry repeats the key and the first attempt's body byte for byte (section 17.11 rule 5)."
  license:
    name: Proprietary - SSPOS
    identifier: LicenseRef-SSPOS-Proprietary
servers:
  - url: "https://{portalHost}"
    description: The portal. HTTPS only (TLS 1.2+).
    variables:
      portalHost:
        default: portal.example.co.uk
tags:
  - name: Onboarding
    description: "Reference only: devices/activate is not called by the till (section 17.4). A till is licensed by licence/activate (tag Licence) and linked to the dashboard by apiKey in that reply or by a sync key (cloud/migrate, sync/hello - SIMPLE-SETUP.md)."
  - name: Licence
    description: Per-till activate and daily check, renewal, keys typed at a linked till and local keys reported by a local till (sections 17.5-17.6, 17.15-17.16).
  - name: Devices
    description: Seats and transfers (section 17.7).
  - name: Sync
    description: Rows up and down (sections 3-9).
  - name: Migration
    description: Local licence to cloud (section 17.8).
security:
  - branchKey: []
paths:
  /api/v1/sync/hello:
    get:
      tags:
        - Sync
      operationId: syncHello
      summary: "Check the address and key (section 4.1)"
      description: "Sent by the branch's main till. No body. The till says hello before its first push or pull after it starts or the key or address changes (then answers from memory), when Connect is pressed with a sync key on a branch that synced before, and after the section 17.8 migration. The portal checks the key, the X-SSPOS-Branch-Id binding and the contract. A 200 naming another company or branch is refused by the till (sync.key_other_install). Idempotent: a GET with no side effects."
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/StoreProtocol"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
      responses:
        "200":
          description: OK
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./schemas/hello-reply.schema.json"
              examples:
                leeds:
                  summary: Leeds main till
                  value:
                    contractVersion: 1
                    companyId: "01K5T0Q8C4000000000000C001"
                    branchId: "01K5T0Q8C4000000000000B001"
                    branchName: Leeds Kirkgate
                    serverTimeUtc: "2026-09-23T09:41:12Z"
                    maxBatchRows: 5000
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "409":
          $ref: "#/components/responses/E409"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
  /api/v1/sync/push:
    post:
      tags:
        - Sync
      operationId: syncPush
      summary: "Till to portal: a batch of changed rows (sections 5 and 7)"
      description: "Body is gzip (Content-Encoding: gzip); accept an uncompressed body too (test tools). Delta mode keys rows by (branchId, seq). Initial mode (X-SSPOS-Sync-Mode: initial + X-SSPOS-Upload-Id, section 17.8) keys them by (uploadId, seq). Idempotent by (entity, entityId, version): storing a triple twice changes nothing and gives the same reply. Every time in the body is UTC with Z (section 6.1). The reply carries receivedAt (revision 1.3): when the portal durably stored the batch, UTC with Z, by the portal clock; store it on every row as received_at and answer a retried batch with the receivedAt its rows were first stored with. Revision 1.4: each entry is the row's latest state - version = the row's rowVersion when the batch was built (payload.rowVersion); several entries of one row in a batch carry the same triple, payload and op (store once, count all as accepted), and a resend may carry a newer state under a newer version (section 7); Setting and RolePermission rows arrive as keyed rows (entityId derived from their key, version = seq; key them by the payload - section 10.3); Customer.balance and Customer.points are the till's cache - sum the CustomerTransaction ledger instead (section 10.1); User rows never carry remoteApprovalSecret (section 10.7); a shop's head-office orders come back with the shop's own status and receipts (section 10.6); a SyncConflict row (a clash on the till) carries hubChange, your pulled envelope as JSON text (section 8). A normal push carries no Idempotency-Key; each history-upload batch carries one (the same for the same bytes until answered)."
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/StoreProtocol"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/ContentEncoding"
        - $ref: "#/components/parameters/SyncMode"
        - $ref: "#/components/parameters/UploadId"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "./schemas/push-request.schema.json"
            examples:
              leeds:
                summary: Leeds till 1 (delta)
                externalValue: "./samples/push-request.json"
              leedsTill2:
                summary: A Leeds till 2 sale, sent by till 1
                externalValue: "./samples/push-request.second-till.json"
              bradford:
                summary: Bradford
                externalValue: "./samples/push-request.second-branch.json"
              settings:
                summary: "Leeds: a shared setting changed, a permission granted and one taken away (section 10.3)"
                externalValue: "./samples/push-request.settings.json"
              initial:
                summary: First rows of an initial (migration) upload
                value:
                  - seq: 1
                    entity: VatRate
                    entityId: "01K5T0Q8C4000000000000V001"
                    op: I
                    version: 1
                    companyId: "01K5M1GR8T000000000000C009"
                    branchId: ""
                    registerId: ""
                    at: "2026-09-01T08:00:00Z"
                    payload:
                      name: Standard
                      code: S
                      percentage: 20.0
                      treatment: apply
                      effectiveFrom: "2011-01-04"
                      effectiveTo: null
                      isDefault: true
                      isZeroValued: false
                      id: "01K5T0Q8C4000000000000V001"
                      companyId: "01K5M1GR8T000000000000C009"
                      createdAt: "2026-09-01T08:00:00Z"
                      updatedAt: "2026-09-01T08:00:00Z"
                      rowVersion: 1
                      deletedAt: null
                      isDeleted: false
                      domainEvents: []
                    key: "VatRate:01K5T0Q8C4000000000000V001:1"
                  - seq: 2
                    entity: VatRate
                    entityId: "01K5T0Q8C4000000000000V002"
                    op: I
                    version: 1
                    companyId: "01K5M1GR8T000000000000C009"
                    branchId: ""
                    registerId: ""
                    at: "2026-09-01T08:00:00Z"
                    payload:
                      name: Zero
                      code: Z
                      percentage: 0.0
                      treatment: apply
                      effectiveFrom: "1973-04-01"
                      effectiveTo: null
                      isDefault: false
                      isZeroValued: true
                      id: "01K5T0Q8C4000000000000V002"
                      companyId: "01K5M1GR8T000000000000C009"
                      createdAt: "2026-09-01T08:00:00Z"
                      updatedAt: "2026-09-01T08:00:00Z"
                      rowVersion: 1
                      deletedAt: null
                      isDeleted: false
                      domainEvents: []
                    key: "VatRate:01K5T0Q8C4000000000000V002:1"
      responses:
        "200":
          description: OK
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./schemas/push-reply.schema.json"
              examples:
                ack:
                  summary: Acknowledged
                  value:
                    acknowledgedSeq: 18239
                    accepted: 9
                    receivedAt: "2026-09-23T09:42:13.207Z"
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "413":
          $ref: "#/components/responses/E413"
        "422":
          $ref: "#/components/responses/E422"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
  /api/v1/sync/pull:
    get:
      tags:
        - Sync
      operationId: syncPull
      summary: "Portal to till: changes after `since` (section 8)"
      description: "Sent by the branch's main till, after its push in every run - even when that push was turned down (422, 413, 400, 5xx, no answer); not after 401/403, a licence.* code, 409 contract.unsupported or 426. Portal-owned rows for the caller's company and branch, oldest version first, at most max, hasMore when more wait (the till asks again, up to 10 pages a run). Revision 1.4 adds: another branch's relayed rows, unchanged, addressed to this branch - a dispatched StockTransfer and its lines to its toBranchId, a StockTransferReceipt and its lines to the transfer's fromBranchId, every other branch's CustomerTransaction rows (section 10.2; never back to the owning branch); Setting / RolePermission keyed rows, never one on the section 10.3 deny-list; BranchPrice rows for this shop (section 10.5); head-office PurchaseOrder rows (origin headOffice) and their lines for this shop (section 10.6). The till never writes Customer.balance or Customer.points from a pull (section 10.1). A row whose parent has not arrived is parked on disk for up to 7 days; a row the shop has changed and not yet pushed becomes a clash that keeps your row (section 8). Idempotent: the till skips any version at or below since and any (entity, entityId, version) it already applied."
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/StoreProtocol"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/Since"
        - $ref: "#/components/parameters/Max"
      responses:
        "200":
          description: OK
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./schemas/pull-reply.schema.json"
              examples:
                leeds:
                  summary: Rows for Leeds
                  externalValue: "./samples/pull-reply.json"
                relay:
                  summary: "Bradford receives a Leeds stock transfer with its lines, and a Leeds customer ledger row (section 10.2)"
                  externalValue: "./samples/pull-reply.relay.json"
                headOffice:
                  summary: "Leeds receives the supplier, two shop prices (BranchPrice) and head-office order HO-000123 with its lines (sections 10.5, 10.6)"
                  externalValue: "./samples/pull-reply.head-office.json"
                empty:
                  summary: Nothing new
                  value:
                    changes: []
                    highestVersion: 90410
                    hasMore: false
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "409":
          $ref: "#/components/responses/E409"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
  /api/v1/devices/activate:
    post:
      tags:
        - Onboarding
      operationId: activateDevice
      deprecated: true
      summary: "NOT CALLED by the till - reference only (section 17.4)"
      description: "Not called by the till since 2026-09-28 - do not build it. Superseded by per-till licence/activate plus the dashboard link (apiKey) in its reply or a sync key (section 17.3 step 3, SIMPLE-SETUP.md). Kept so the branch-model design stays documented: no Authorization header, the activation code in the body is the credential; rate-limited (section 17.12); the same code from the same installId within 24 h returns the same 200 reply."
      security: []
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/InstallId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
