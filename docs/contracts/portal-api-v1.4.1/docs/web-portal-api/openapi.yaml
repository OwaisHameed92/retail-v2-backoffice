      operationId: redeemLicence
      summary: "A key typed at a linked till, or a local key reported by a local till (sections 17.6, 17.16)"
      description: "(a) A key typed or pasted at a linked till (branch key). (b) Since 2026-09-28 a till holding a local (licence generator) key reports it once, when a licence server is set and reachable: keyType token, installCode, installId, no Authorization - the signed token is the credential. First sighting of a licenceId -> record licenceId -> installCode, 200 result recorded; the same licenceId from another installCode -> 409 key.used_on_another_install (the till locks). Renewals for that till are bound to its installCode. The body also carries deviceName, appVersion, os and tillClockUtc; a retry (the next daily check for a report) repeats the Idempotency-Key and the first body until you answer. Only 200 and 409 key.used_on_another_install change anything on the till."
