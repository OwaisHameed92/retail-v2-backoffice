                    seatsInUse: 1
                    maxRegisters: 2
                    apiKeyRevoked: false
                    transferCode: null
                    transferCodeExpiresAt: null
                    portalTimeUtc: "2026-10-04T17:00:01Z"
                    messages: []
                mainTill:
                  summary: Released, transfer code issued
                  value:
                    registerId: "01K5T0Q8C4000000000000R001"
                    seat: deactivated
                    seatsInUse: 1
                    maxRegisters: 3
                    apiKeyRevoked: true
                    transferCode: SSP-TRF-8M3K-2QXD
                    transferCodeExpiresAt: "2026-10-11T17:00:00Z"
                    portalTimeUtc: "2026-10-04T17:00:01Z"
