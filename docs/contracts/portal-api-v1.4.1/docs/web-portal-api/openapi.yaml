  /api/v1/devices/deactivate:
    post:
      tags:
        - Devices
      operationId: deactivateDevice
      summary: Release this till - free its seat, or release the main till for a transfer (section 17.7)
      description: "Sent by the till being released (Settings > Licence > Deactivate this till), for its own registerId and installId. Branch key when the till holds one (a per-till licence is identified by registerId + installId). Idempotent by registerId (twice = the same reply) and by Idempotency-Key (a retry repeats key and body until answered). On 200 the till forgets its cloud link, withdraws the licence it holds and writes an AuditLog row; any refusal or no answer changes nothing on the till."
      security:
        - branchKey: []
        - {}
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/InstallId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "./licensing/schemas/deactivate-request.schema.json"
            examples:
              secondTill:
                summary: Remove Till 2
                value:
                  registerId: "01K5T0Q8C4000000000000R002"
                  installId: "01K5T0Q8C4000000000000H002"
                  reason: removed
                  note: Till 2 moved to the stock room as a spare.
              mainTill:
                summary: Move the main till to a new PC
                value:
                  registerId: "01K5T0Q8C4000000000000R001"
                  installId: "01K5T0Q8C4000000000000H001"
                  reason: transfer
                  note: New PC arriving Monday.
      responses:
        "200":
          description: OK
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
