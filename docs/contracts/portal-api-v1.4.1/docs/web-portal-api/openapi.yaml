                  totalRows: 159306
                  highestSeq: 159306
                  rowCounts:
                    VatRate: 4
                    Department: 12
                    Category: 58
                    Product: 3120
                    ProductBarcode: 3388
                    Customer: 41
                    User: 5
                    Register: 1
                    BranchProduct: 3120
                    Shift: 176
                    Sale: 15840
                    SaleLine: 41210
                    SalePayment: 16102
                    SaleVat: 22017
                    StockMovement: 44916
                    ZReport: 176
                    AuditLog: 9120
                  snapshotChangeLogSeq: 212806
      responses:
        "200":
          description: OK
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/migrate-complete-reply.schema.json"
              examples:
                complete:
                  summary: Counts match
                  value:
                    uploadId: "01K5TA00000000000000000G01"
                    status: complete
                    received: 159306
                    resumeFromSeq: 159306
                    missing: []
                    pushResumesAfterSeq: 212806
                    portalTimeUtc: "2026-09-26T14:02:10Z"
                    messages: []
                incomplete:
                  summary: "Some rows missing: resend"
                  value:
                    uploadId: "01K5TA00000000000000000G01"
                    status: incomplete
                    received: 154306
                    resumeFromSeq: 140000
                    missing:
                      - entity: StockMovement
                        expected: 44916
                        received: 39916
                    pushResumesAfterSeq: 212806
                    portalTimeUtc: "2026-09-26T14:02:10Z"
                    messages: []
        "400":
          $ref: "#/components/responses/E400"
        "401":
          $ref: "#/components/responses/E401"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          $ref: "#/components/responses/E404"
        "409":
          $ref: "#/components/responses/E409"
        "422":
          $ref: "#/components/responses/E422"
        "426":
          $ref: "#/components/responses/E426"
        "429":
          $ref: "#/components/responses/E429"
        "500":
          $ref: "#/components/responses/E500"
        "503":
          $ref: "#/components/responses/E503"
components:
  securitySchemes:
    branchKey:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: "The branch's sync key (sync.hub_api_key): typed by the owner at Connect, or returned by the portal as apiKey in licence/activate, licence/validate or cloud/migrate. One key per branch. Required on sync/* and cloud/migrate/complete; sent on licence/* and devices/deactivate only when the till holds one."
  parameters:
    Contract:
      name: X-SSPOS-Contract
      in: header
      required: true
      description: Contract major version the till speaks. 1 today. See section 17.11.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "1"
    AppVersion:
      name: X-SSPOS-App-Version
      in: header
      required: true
      description: Till version.
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/appVersion"
      example: "3.0.412"
    StoreProtocol:
      name: X-SSPOS-Store-Protocol
      in: header
      required: true
      description: "The till's LAN store protocol version (src/SSPOS.Server/Contracts/StoreProtocol.cs), sent on the sync and migration calls (not on licence or device calls). 3 since 2026-09-28: 2 when a second till's work began to be written on the main till as that till, 3 when the main till's staff list (and, as optional calls within 3, its shop-wide settings and shop prices) began to be copied to every till (docs/web-portal-api.md section 2 point 2); 1 before. Informational: accept any number."
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "3"
    CompanyId:
      name: X-SSPOS-Company-Id
      in: header
      required: true
      description: Company of the calling till.
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000C001"
    BranchId:
      name: X-SSPOS-Branch-Id
      in: header
      required: true
      description: "Branch of the calling till; must be the API key's branch."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000B001"
    RegisterId:
      name: X-SSPOS-Register-Id
      in: header
      required: true
      description: "The calling till: on sync and migration calls always the branch's main till (the sender); on licence and device calls the till licensing or releasing itself."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000R001"
    InstallId:
      name: X-SSPOS-Install-Id
      in: header
      required: true
      description: "The PC's install id (same as installId in the body). Sent on licence, device and migration calls; the sync calls (hello, push, pull) do not send it."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
      example: "01K5T0Q8C4000000000000H001"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "One per logical request (the till sends a ULID). The till keeps the key from the first attempt until the portal answers and repeats it - with the first attempt's body byte for byte, tillClockUtc included - after no reply, 408, 409 request.in_progress, 429, 502, 503 or 504, across restarts, for up to 12 hours; any other reply ends the request. The portal stores (key, endpoint, caller, body hash) -> reply for at least 24 h and replays it for the same body; a different body -> 422 request.idempotency_mismatch; still running -> 409 request.in_progress + Retry-After. Never store a 408, 409 request.in_progress, 429, 502, 503 or 504 reply under the key (section 17.11 rule 5)."
      schema:
        type: string
        minLength: 8
        maxLength: 64
      example: "01K5T0Q8C4000000000000Z001"
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: "Absent on a normal (delta) push - its rows are the idempotency, by (entity, entityId, version) and (branchId, seq). Present on every history-upload batch (X-SSPOS-Sync-Mode: initial): one key per batch, repeated with the same bytes until the portal answers (section 17.11 rule 5)."
      schema:
        type: string
        minLength: 8
        maxLength: 64
    ContentEncoding:
      name: Content-Encoding
      in: header
      required: false
      description: The till always sends gzip.
      schema:
        type: string
        enum:
          - gzip
      example: gzip
    SyncMode:
      name: X-SSPOS-Sync-Mode
      in: header
      required: false
      description: "delta (default) or initial (a migration upload). Unknown = 400."
      schema:
        type: string
        enum:
          - delta
          - initial
        default: delta
      example: delta
    UploadId:
      name: X-SSPOS-Upload-Id
      in: header
      required: false
      description: "Required when X-SSPOS-Sync-Mode is initial: upload.uploadId from the migrate reply."
      schema:
        $ref: "./licensing/schemas/common.schema.json#/$defs/ulid"
    Since:
      name: since
      in: query
      required: true
      description: Highest pull version this branch has applied (0 the first time).
      schema:
        type: integer
        minimum: 0
      example: 90400
    Max:
      name: max
      in: query
      required: false
      description: "Most rows to return (<= 5000; the branch's sync.batch_size)."
      schema:
        type: integer
        minimum: 1
        maximum: 5000
        default: 5000
      example: 5000
  headers:
    RetryAfter:
      description: "Seconds to wait (also in the body's retryAfterSeconds)."
      schema:
        type: integer
        minimum: 1
    Contract:
      description: Contract major version of this reply.
      schema:
        type: string
        pattern: "^[0-9]+$"
      example: "1"
  schemas:
    ErrorReply:
      $ref: "./licensing/schemas/error-reply.schema.json"
    LicenceTokenPayload:
      $ref: "./licensing/schemas/licence-token-payload.schema.json"
  responses:
    E400:
      description: "Bad request. Codes: `request.invalid` (*). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            request-invalid:
              summary: request.invalid
              value:
                code: request.invalid
                message: Body or query does not match the schema (missing field, bad ULID, bad date).
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  field: name of the first bad field
    E401:
      description: "Unauthorised. Codes: `auth.invalid_key` (sync/*, licence/validate, licence/redeem, devices/deactivate, cloud/migrate/complete); `auth.key_revoked` (sync/*, licence/validate, licence/redeem, devices/deactivate, cloud/migrate/complete). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            sync-401:
              summary: samples/error-reply.401.json
              value:
                code: auth.invalid_key
                message: "The portal API key is not recognised. Check Settings > Hub sync > Portal API key."
                traceId: req-7c1f9a
                retryAfterSeconds: null
                rejectedKey: null
    E403:
      description: "Forbidden. Codes: `auth.wrong_branch` (sync/*, licence/validate, licence/redeem, devices/deactivate); `device.not_main_till` (licence/validate, licence/redeem, devices/deactivate, cloud/migrate/complete); `licence.seat_limit` (devices/activate, cloud/migrate, licence/activate); `licence.not_active` (devices/activate, cloud/migrate, licence/activate); `key.not_for_this_branch` (licence/redeem); `key.not_allowed` (licence/redeem). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            seat-limit:
              summary: error.seat-limit.403
              value:
                code: licence.seat_limit
                message: Your plan allows 2 tills and 2 are in use. Add a till to your plan on the portal.
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  maxRegisters: 2
                  registersInUse: 2
    E404:
      description: "Not found. Codes: `activation.code_not_found` (devices/activate, cloud/migrate); `device.not_found` (devices/deactivate); `key.not_found` (licence/redeem, licence/activate, licence/validate); `migrate.upload_not_found` (sync/push (initial), cloud/migrate/complete); `sync_key.not_found` (cloud/migrate). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            activation-code-not-found:
              summary: error.activation-code-not-found.404
              value:
                code: activation.code_not_found
                message: That activation code is not recognised. Check the code in your welcome email.
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details: null
    E409:
      description: "Conflict. Codes: `request.in_progress` (*); `contract.unsupported` (*); `activation.code_used` (devices/activate, cloud/migrate); `activation.use_migrate` (devices/activate); `device.branch_already_linked` (devices/activate, cloud/migrate); `key.already_redeemed` (licence/redeem); `migrate.already_migrated` (cloud/migrate); `migrate.upload_closed` (sync/push (initial)); `key.already_used` (licence/activate); `key.used_on_another_install` (licence/redeem); `sync_key.used` (cloud/migrate). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            request-in-progress:
              summary: "request.in_progress - the first attempt with this Idempotency-Key is still running (never store this reply under the key)"
              value:
                code: request.in_progress
                message: Your request is still being processed. Please wait a moment.
                traceId: req-8a21f1
                retryAfterSeconds: 5
                rejectedKey: null
                details: null
            branch-already-linked:
              summary: error.branch-already-linked.409
              value:
                code: device.branch_already_linked
                message: Leeds Kirkgate is already linked to KIRKGATE-TILL1. Release that till first, on the portal or on the old till.
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  registerId: "01K5T0Q8C4000000000000R001"
                  deviceName: KIRKGATE-TILL1
                  lastSeenUtc: "2026-10-04T16:58:00Z"
            key-already-redeemed:
              summary: error.key-already-redeemed.409
              value:
                code: key.already_redeemed
                message: This licence key has already been used.
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  redeemedAtUtc: "2026-09-20T10:00:00Z"
            key-used-on-another-install:
              summary: error.key-used-on-another-install.409
              value:
                code: key.used_on_another_install
                message: This key is already used on another PC - contact your dealer.
                traceId: req-5d19be
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  licenceId: "01K5M1GR8T000000000000Y004"
                  installCode: "Q3EG-1RNC"
                  firstSeenUtc: "2026-09-28T11:02:14Z"
            use-migrate:
              summary: error.use-migrate.409
              value:
                code: activation.use_migrate
                message: "This till already has sales for another install. Use 'Move my shop to the cloud' so your history is kept."
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  branchId: "01K5T0Q8C4000000000000B001"
    E410:
      description: "Gone. Codes: `activation.code_expired` (devices/activate, cloud/migrate); `key.expired` (licence/redeem, licence/activate); `sync_key.expired` (cloud/migrate). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            activation-code_expired:
              summary: activation.code_expired
              value:
                code: activation.code_expired
                message: The code is past its expiry.
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details: null
    E413:
      description: "Payload too large. Codes: `batch.too_large` (sync/push). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            batch-too_large:
              summary: batch.too_large
              value:
                code: batch.too_large
                message: More rows or bytes than accepted.
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  maxRows: 5000
    E422:
      description: "Unprocessable. Codes: `request.idempotency_mismatch` (*); `row.invalid` (sync/push); `licence.format` (licence/redeem, devices/activate, cloud/migrate); `licence.bad_signature` (licence/redeem, devices/activate, cloud/migrate); `licence.bad_signer_certificate` (licence/redeem, devices/activate, cloud/migrate); `licence.unknown_key` (licence/redeem, devices/activate, cloud/migrate); `licence.expired` (licence/redeem, cloud/migrate); `licence.wrong_shop` (licence/redeem, cloud/migrate); `licence.unsupported_version` (licence/redeem, devices/activate, cloud/migrate); `licence.wrong_branch` (licence/redeem). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            idempotency-mismatch:
              summary: "request.idempotency_mismatch - the same Idempotency-Key with a different body (the till never does this; it is a bug to report)"
              value:
                code: request.idempotency_mismatch
                message: This request key was already used with a different request.
                traceId: req-8a21f2
                retryAfterSeconds: null
                rejectedKey: null
                details: null
            licence-bad-signature:
              summary: error.licence-bad-signature.422
              value:
                code: licence.bad_signature
                message: This licence key is not genuine or has been changed. Paste it again or ask your dealer.
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details: null
            sync-422:
              summary: samples/error-reply.422.json
              value:
                code: row.invalid
                message: Sale 01K5VB000000000SR001000482 has a total with more than 2 decimal places.
                traceId: req-7c1fa0
                retryAfterSeconds: null
                rejectedKey: "Sale:01K5VB000000000SR001000482:1"
    E426:
      description: "Upgrade required. Codes: `app.update_required` (*). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            update-required:
              summary: error.update-required.426
              value:
                code: app.update_required
                message: "This till needs updating before it can link. Settings > Updates > Check now."
                traceId: req-8a21f0
                retryAfterSeconds: null
                rejectedKey: null
                details:
                  minimumAppVersion: "3.0.400"
    E429:
      description: "Too many requests. Codes: `rate.limited` (*); `activation.too_many_attempts` (devices/activate, cloud/migrate, licence/activate). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            activation-too-many-attempts:
              summary: error.activation-too-many-attempts.429
              value:
                code: activation.too_many_attempts
                message: Too many wrong codes. Try again in 15 minutes.
                traceId: req-8a21f0
                retryAfterSeconds: 900
                rejectedKey: null
                details: null
    E500:
      description: "Server error. Codes: `server.error` (*). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            server-error:
              summary: server.error
              value:
                code: server.error
                message: Unexpected portal fault.
                traceId: req-8a21f0
                retryAfterSeconds: 30
                rejectedKey: null
                details: null
    E503:
      description: "Service unavailable. Codes: `server.busy` (*). Full list: licensing/samples/error-codes.json."
      headers:
        X-SSPOS-Contract:
          $ref: "#/components/headers/Contract"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        "application/json":
          schema:
            $ref: "#/components/schemas/ErrorReply"
          examples:
            server-busy:
              summary: server.busy
              value:
                code: server.busy
                message: Portal overloaded or in maintenance.
                traceId: req-8a21f0
                retryAfterSeconds: 30
                rejectedKey: null
                details: null
