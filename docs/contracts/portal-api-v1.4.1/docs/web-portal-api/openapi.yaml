  /api/v1/licence/activate:
    post:
      tags:
        - Licence
      operationId: activateLicenceKey
      summary: "Per-till licence: bind an e-mailed licence key to this PC and get its token (section 17.15.1)"
      description: "Sent by ANY till when the shop pastes the e-mailed key. No Authorization header needed: the licence key in the body is the credential (a till that has a branch key may still send it). First use binds the key to installId; the same installId again gets 200; another installId gets 409 key.already_used. Rate-limited (section 17.12). Since 2026-09-28 the signed token carries the shop: companyId/branchId (the same in every till key of the branch), businessName/branchName, the company block (businessType, address, town, postcode, phone, email, vatNumber, ownerName, receiptFooter), maxRegisters = tills allowed in the branch, features (multi_branch), limits.branches, validFrom/expiresAt - and the reply's licence summary lists them too (section 17.15.1). A new installId past the branch's maxRegisters gets 403 licence.seat_limit. Optional apiKey (+ hubUrl) in the reply links the dashboard: the till stores it and switches cloud sync on (section 17.3 step 3). Idempotent per (key, installId) and by Idempotency-Key: pressing Enter key again (even after a restart) before you answer repeats the key and the first body, tillClockUtc included - answer it like the first (a bound key from the same installId is a 200, never 409)."
      security:
        - {}
        - branchKey: []
      parameters:
        - $ref: "#/components/parameters/Contract"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/InstallId"
        - $ref: "#/components/parameters/CompanyId"
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/RegisterId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "./licensing/schemas/licence-activate-request.schema.json"
            examples:
              tillOne:
                summary: Till 1 pastes the e-mailed key
                externalValue: "./licensing/samples/licence-activate-request.json"
      responses:
        "200":
          description: OK - the key is bound to this PC; store licenceToken
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/licence-activate-reply.schema.json"
              examples:
                active:
                  summary: "Annual plan, Till 1 of 3, with the shop's details (token signed with the documentation key k13799fa4)"
                  externalValue: "./licensing/samples/licence-activate-reply.json"
        "400":
          $ref: "#/components/responses/E400"
        "403":
          $ref: "#/components/responses/E403"
        "404":
          description: "key.not_found - no such licence key."
          headers:
            X-SSPOS-Contract:
              $ref: "#/components/headers/Contract"
          content:
            "application/json":
              schema:
                $ref: "./licensing/schemas/error-reply.schema.json"
              examples:
                notFound:
                  externalValue: "./licensing/samples/error.key-not-found.404.json"
        "409":
          description: "key.already_used - the key is bound to another PC (details: deviceName, installCode, activatedAtUtc); nothing changes on the till. Also request.in_progress (+ Retry-After) while the first attempt with this Idempotency-Key is still being worked on: the till waits, then repeats the same key and body."
