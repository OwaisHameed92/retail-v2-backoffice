  /api/v1/licence/validate:
    post:
      tags:
        - Licence
      operationId: validateLicence
      summary: Daily licence check, per till (sections 17.15.2, 17.5)
      description: "What the till sends (section 17.15.2, example perTill): EVERY till with a portal licence sends it for itself once onlineCheck.intervalHours have passed since its last successful check (a 15-minute timer), at start-up when due, and on Check again - identified by installId + licenceId + tokenSha256, no branch key required (sent when held). An unanswered check is repeated at the next tick with the same Idempotency-Key and the first attempt's body (tillClockUtc, clockWatermarkUtc included). The branch-model body (example leeds: the main till listing registers[], lastSyncAt, diagnostics) is not sent by this till version (section 17.5). Licence problems are 200 + status (active, expiring, expired, revoked, suspended, released; unknown = not active), never an error status. Only active and expiring let a per-till till trade: seatLimit (branch model, examples seatLimit and the registers[] seats) is not used for per-till licences and, if sent, locks it like any other status (section 17.9). The till acts on status, licenceToken, portalTimeUtc, messages and apiKey / hubUrl; licence, registers, minimumAppVersion and nextCheckAfterSeconds are not acted on yet."
